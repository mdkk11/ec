name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      static_and_unit: ${{ steps.select.outputs.static_and_unit }}
      backend_integration: ${{ steps.select.outputs.backend_integration }}
      storybook_vrt: ${{ steps.select.outputs.storybook_vrt }}
      e2e: ${{ steps.select.outputs.e2e }}
      e2e_mode: ${{ steps.select.outputs.e2e_mode }}
      e2e_reason: ${{ steps.select.outputs.e2e_reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Test CI job selector
        run: node --test scripts/impact/select-ci-jobs.test.mjs
      - name: Select CI jobs
        id: select
        env:
          IMPACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          IMPACT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IMPACT_FULL_RUN: ${{ github.event_name == 'push' }}
        run: node scripts/impact/select-ci-jobs.mjs

  static-and-unit:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.static_and_unit != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify action pins
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: 'false'
          min_age: '7'
          verify: 'true'
          verify_min_age: 'true'
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test impact selectors
        run: node --test scripts/impact/*.test.mjs
      - name: Test tooling
        run: node --test scripts/tooling/*.test.mjs
      - name: Format
        run: pnpm format
      - name: Lint
        run: pnpm lint
      - name: Verify lint responsibilities
        run: pnpm lint:parity
      - name: Typecheck
        run: pnpm typecheck
      - name: Find unused code
        run: pnpm knip
      - name: Unit tests
        run: pnpm test:unit
      - name: Frontend integration tests
        run: pnpm test:frontend

  backend-integration:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend_integration != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://mockshop:mockshop_local@localhost:5432/mockshop_test
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: mockshop_test
          POSTGRES_PASSWORD: mockshop_local
          POSTGRES_USER: mockshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mockshop -d mockshop_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare backend database
        run: pnpm db:prepare:test
      - name: Backend integration tests
        run: pnpm test:backend

  storybook-vrt:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.storybook_vrt != 'false') }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Storybook VRT
        run: pnpm test:vrt
      - name: Upload Storybook VRT artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-vrt-failure-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: warn

  e2e:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.e2e != 'false') }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    timeout-minutes: 20
    env:
      E2E_DATABASE_URL: postgresql://mockshop:mockshop_local@postgres:5432/mockshop_e2e
      NODE_ENV: test
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: mockshop_e2e
          POSTGRES_PASSWORD: mockshop_local
          POSTGRES_USER: mockshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mockshop -d mockshop_e2e"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Select affected E2E specs
        id: e2e-impact
        if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.e2e_mode == 'select' }}
        continue-on-error: true
        env:
          IMPACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          IMPACT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm ci:impact:select
      - name: Full E2E
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.e2e_mode != 'select' || steps.e2e-impact.outcome != 'success' }}
        run: pnpm test:e2e
      - name: Selected E2E
        if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.e2e_mode == 'select' && steps.e2e-impact.outcome == 'success' }}
        run: pnpm test:e2e:selected
      - name: Fail when E2E impact selection crashed
        if: ${{ steps.e2e-impact.outcome == 'failure' }}
        run: exit 1
      - name: Upload E2E impact selection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-impact-${{ github.run_attempt }}
          path: .impact
          retention-days: 7
          if-no-files-found: warn
      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: warn
