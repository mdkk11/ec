services:
  postgres-dev:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: mockshop_dev
      POSTGRES_PASSWORD: mockshop_local
      POSTGRES_USER: mockshop
    ports:
      - "5432:5432"
    volumes:
      - mockshop-postgres-dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mockshop -d mockshop_dev"]
      interval: 2s
      timeout: 5s
      retries: 15

  postgres-test:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: mockshop_test
      POSTGRES_PASSWORD: mockshop_local
      POSTGRES_USER: mockshop
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mockshop -d mockshop_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  postgres-e2e:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: mockshop_e2e
      POSTGRES_PASSWORD: mockshop_local
      POSTGRES_USER: mockshop
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mockshop -d mockshop_e2e"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  mockshop-postgres-dev:
